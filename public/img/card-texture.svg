<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300">
<defs>
<filter id="g" x="0" y="0" width="240" height="300" filterUnits="userSpaceOnUse">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="9" stitchTiles="stitch"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .36  0 0 0 0 .2  0 0 0 .42 -.13"/>
</filter>
<filter id="fib" x="0" y="0" width="240" height="300" filterUnits="userSpaceOnUse">
  <feTurbulence type="fractalNoise" baseFrequency="0.05 0.22" numOctaves="4" seed="4" stitchTiles="stitch"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .25  0 0 0 .34 -.11"/>
</filter>
<filter id="blot" x="0" y="0" width="240" height="300" filterUnits="userSpaceOnUse">
  <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="21" stitchTiles="stitch"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .78  0 0 0 0 .6  0 0 0 0 .36  0 0 0 .34 -.09"/>
</filter>
<pattern id="laid" width="240" height="3" patternUnits="userSpaceOnUse"><rect width="240" height=".7" y="1.2" fill="#B9873F" opacity=".07"/></pattern>
<pattern id="chain" width="3.2" height="240" patternUnits="userSpaceOnUse"><rect width=".5" height="240" x="1.4" fill="#B9873F" opacity=".045"/></pattern>
</defs>
<rect width="240" height="300" fill="#FFFBF5"/>
<rect width="240" height="300" filter="url(#blot)"/>
<rect width="240" height="300" filter="url(#fib)"/>
<rect width="240" height="300" fill="url(#laid)"/>
<rect width="240" height="300" fill="url(#chain)"/>
<rect width="240" height="300" filter="url(#g)"/>
</svg>